name: Tests

# La capa Python era la única sin puerta: `build-apk` compila el WebView,
# `build-native` exige la paridad Kotlin y `build-surco` corre JVM + lint +
# humo. Mientras tanto, aquí viven las pruebas del núcleo, de la validación de
# fuentes, del middleware de token y las tres que comprueban que el servidor
# **importa** y sirve de verdad el cliente entero --- y no las ejecutaba nadie.
# Costó caro: `uvicorn argos.api.main:app`, el arranque documentado, moría con
# `NameError` en la primera línea y nada lo decía.

on:
  push:
    paths:
      - 'argos/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # `tests/test_engine_js.py`, `test_brain_js.py` y `test_tracking_js.py`
      # ejecutan el motor JS real en Node: la paridad no se comprueba con un
      # sustituto.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El proyecto se usa desde el árbol y no instalado: `pip install -e .`
      # falla por el layout plano (varios paquetes de primer nivel). Se instalan
      # las dependencias de `pyproject.toml` con su techo, más el extra
      # `server`, que es lo que importan los tests de seguridad.
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<3" "scipy>=1.10,<2" \
            "opencv-python-headless>=4.8,<5" \
            "pytest>=8,<9" "httpx>=0.27,<1" "fastapi>=0.110,<1"

      # `python -m pytest` deja la raíz del repositorio en sys.path; el binario
      # `pytest` a secas no, y las pruebas importan `argos.*`.
      - name: Pruebas
        run: python -m pytest tests/ -q
