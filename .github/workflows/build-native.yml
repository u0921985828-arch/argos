name: Build APK nativo

# La app NATIVA (android-native/): CameraX + núcleo Kotlin + ONNX Runtime
# Android. Convive con la app web (build-apk.yml), no la sustituye: las dos
# empaquetan el mismo modelo y se comparan en el mismo emulador.

on:
  workflow_dispatch:
    inputs:
      apk_branch:
        description: >-
          `publicar` deja el APK en la rama `apk-nativo` para recogerlo con git
          desde donde el almacén de artifacts no llega. `borrar` la elimina y no
          compila nada: un binario no debe quedarse en el repositorio más de lo
          necesario.
        type: choice
        options: [ 'no', 'publicar', 'borrar' ]
        default: 'no'
  push:
    paths:
      - 'android-native/**'
      - 'argos/api/static/engine.js'
      - 'scripts/dump_js.js'
      - 'scripts/ref_*.js'
      - 'scripts/prep_*.py'
      - 'argos/api/static/brain.js'
      - 'argos/api/static/behaviour.js'
      - 'argos/api/static/detector.js'
      - 'argos/api/static/ask.js'
      - '.github/workflows/build-native.yml'
      - '.github/scripts/smoke-nativo.sh'

# Mínimo por defecto. Solo escriben los trabajos que tocan la rama `apk-nativo`;
# el de humo ejecuta una acción de terceros y no necesita más que leer.
permissions:
  contents: read

jobs:
  cleanup:
    if: inputs.apk_branch == 'borrar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the `apk-nativo` branch
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/apk-nativo" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/apk-nativo"
            echo "rama apk-nativo borrada"
          else
            echo "no había rama apk-nativo"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: inputs.apk_branch != 'borrar'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Igual que en la app web: `packages: ''` evita pedir el paquete `tools`,
      # retirado del repositorio de Google, que tumba el job en el segundo 20.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Python propio: el del sistema en ubuntu-24.04 rechaza `pip install`
      # (PEP 668), y la paridad del detector necesita OpenCV para decodificar.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch detector weights and self-test photo
        run: |
          curl -sSL -o yolox_nano.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
          test "$(stat -c%s yolox_nano.onnx)" -gt 3000000
          # Perro, bicicleta y furgoneta; sin personas a propósito.
          curl -sSL -o autoprueba.jpg \
            https://raw.githubusercontent.com/pjreddie/darknet/master/data/dog.jpg
          test "$(stat -c%s autoprueba.jpg)" -gt 100000

      # La voz de ARGOS: Piper es_ES «davefx», calidad media, CC0. Se fija por
      # su sha256: si en Hugging Face cambia el fichero, el CI lo dice en vez
      # de meter en el APK una voz distinta.
      - name: Fetch ARGOS voice (Piper es_ES davefx medium)
        run: |
          set -e
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          curl -fsSL -o voz.onnx "$base/es_ES-davefx-medium.onnx"
          curl -fsSL -o voz.onnx.json "$base/es_ES-davefx-medium.onnx.json"
          curl -fsSL -o voz-ficha.txt "$base/MODEL_CARD"
          echo "6658b03b1a6c316ee4c265a9896abc1393353c2d9e1bca7d66c2c442e222a917  voz.onnx" | sha256sum -c -
          python3 -c "import json; d=json.load(open('voz.onnx.json')); assert 'phoneme_id_map' in d"
          grep -q "CC0" voz-ficha.txt

      - name: Ensure Gradle wrapper
        working-directory: android-native
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x gradlew

      # El núcleo contra engine.js, frame a frame, con y sin detector. Cero
      # divergencias o no hay APK: dos implementaciones que se separan en
      # silencio son peores que una sola.
      - name: Core parity with engine.js
        run: |
          node scripts/dump_js.js
          cd android-native && ./gradlew --no-daemon :core:paridad

      # El detector contra detector.js sobre fotos reales (C1), en cuadro entero
      # y en teselas ×2, y el caso reservado de las filas rellenadas. Sin esto
      # una regresión en Detector.kt solo la vería la autoprueba del emulador,
      # que mira una foto y tolera mucho más.
      - name: Detector parity, auto zoom, scene, handheld camera and memory
        run: |
          set -e
          D=android-native/build/det
          mkdir -p "$D" /tmp/fotos
          cp yolox_nano.onnx "$D/"
          curl -sSL -o /tmp/fotos/bus.jpg https://github.com/ultralytics/assets/releases/download/v0.0.0/bus.jpg
          curl -sSL -o /tmp/fotos/zidane.jpg https://github.com/ultralytics/assets/releases/download/v0.0.0/zidane.jpg
          cp autoprueba.jpg /tmp/fotos/dog.jpg
          pip install -q opencv-python-headless
          python3 scripts/prep_detector_ref.py "$D" /tmp/fotos/bus.jpg /tmp/fotos/zidane.jpg /tmp/fotos/dog.jpg
          npm install -q --prefix /tmp/ortw onnxruntime-web@1.22.0
          node scripts/ref_detector.js "$D" /tmp/ortw/node_modules/onnxruntime-web
          python3 scripts/prep_plaza.py "$D" /tmp/fotos/bus.jpg /tmp/fotos/zidane.jpg
          node scripts/ref_scene.js
          node scripts/ref_behaviour.js
          node scripts/ref_ask.js
          cd android-native && ./gradlew --no-daemon :core:paridadDetector :core:casoReservado \
            :core:zoomAutomatico :core:paridadEscena :core:escenaViva :core:camaraEnMano :core:casosCamara :core:fisica :core:radio :core:voz :core:estabiliza :core:memoria :core:fijos \
            :core:paridadComportamiento :core:comportamientoVivo :core:chat

      # Las listas de cámaras públicas, tal como las sirven HOY los organismos:
      # si cambian de formato, el CI lo dice antes que el usuario.
      - name: Live public camera catalogs
        working-directory: android-native
        # Cada lista que trae la app, pedida ahora a su organismo, y la
        # primera cámara de cada sitio comprobada como HLS de verdad.
        run: ./gradlew --no-daemon :core:catalogo -Pvivo=red

      # Release, no depuración: no depurable y sin `run-as` sobre la memoria.
      # Con el secreto ARGOS_KEYSTORE_B64 se firma con la clave de tienda; sin
      # él, con la de depuración del ejecutor, que cambia en cada compilación.
      - name: Build release APK
        working-directory: android-native
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/argos.jks"
            export ARGOS_KEYSTORE="$RUNNER_TEMP/argos.jks"
          fi
          ./gradlew --no-daemon :app:assembleRelease
          rm -f "$RUNNER_TEMP/argos.jks"
        env:
          KS_B64: ${{ secrets.ARGOS_KEYSTORE_B64 }}
          ARGOS_KEYSTORE_PASS: ${{ secrets.ARGOS_KEYSTORE_PASS }}
          ARGOS_KEY_ALIAS: ${{ secrets.ARGOS_KEY_ALIAS }}
          ARGOS_KEY_PASS: ${{ secrets.ARGOS_KEY_PASS }}

      - name: Verify the APK carries what it needs
        run: |
          set -e
          # Un APK por arquitectura. Cada uno: no depurable, con modelo, voz y
          # ficha, con SU biblioteca nativa y sin las de las otras.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            APK=android-native/app/build/outputs/apk/release/app-$abi-release.apk
            if "$AAPT" dump badging "$APK" | grep -q application-debuggable; then
              echo "::error::el APK $abi es depurable"; exit 1
            fi
            unzip -l "$APK" > contenido.txt
            for f in assets/yolox_nano.onnx assets/autoprueba.jpg assets/voz.onnx assets/voz.onnx.json \
                     assets/voz-ficha.txt lib/$abi/libonnxruntime.so; do
              grep -q "$f" contenido.txt || { echo "::error::falta $f en el APK $abi"; exit 1; }
            done
            if grep "lib/" contenido.txt | grep -v "lib/$abi/" | grep -q "\.so"; then
              echo "::error::el APK $abi lleva bibliotecas de otra arquitectura"; exit 1
            fi
            ls -l "$APK"
          done
          cp android-native/app/build/outputs/apk/release/app-arm64-v8a-release.apk ARGOS-nativo.apk
          cp android-native/app/build/outputs/apk/release/app-armeabi-v7a-release.apk ARGOS-nativo-armv7.apk
          cp android-native/app/build/outputs/apk/release/app-x86_64-release.apk ARGOS-nativo-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-nativo
          path: |
            ARGOS-nativo.apk
            ARGOS-nativo-armv7.apk
            ARGOS-nativo-x86_64.apk
          if-no-files-found: error

      - name: Publish APK to the `apk-nativo` branch
        if: inputs.apk_branch == 'publicar'
        run: |
          set -e
          work=$(mktemp -d)
          # Los de teléfono (arm64 y armv7). Por si alguno pasa de los 100 MB
          # que admite un fichero en git, van en trozos de 90 MB que se juntan
          # con `cat`; con uno solo, es un único trozo.
          for f in ARGOS-nativo.apk ARGOS-nativo-armv7.apk; do
            split -b 90m "$f" "$work/$f.parte-"
            sha256sum "$f" > "$work/$f.sha256"
          done
          cd "$work"
          git init -q -b apk-nativo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.parte-* *.sha256
          git commit -q -m "APK nativo de ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-nativo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk-nativo }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # El MISMO emulador que la app web (API 34, x86_64, cámara emulada), para
      # que las cifras de las dos se puedan poner una al lado de la otra.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/smoke-nativo.sh ARGOS-nativo-x86_64.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-nativo
          path: |
            screenshot.png
            logcat.txt
