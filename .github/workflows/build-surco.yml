name: Build Surco

# Surco (surco/): reproductor de música que organiza por etiquetas. Proyecto
# aparte de ARGOS; vive aquí porque es donde hay un ejecutor con Android SDK
# y Google Maven, que el contenedor de desarrollo no alcanza.

on:
  workflow_dispatch:
  push:
    paths:
      - 'surco/**'
      - '.github/workflows/build-surco.yml'
      - '.github/scripts/smoke-surco.sh'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Paquetes explícitos: el de serie pide `tools`, retirado, y tumba el job.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # Release minificado (R8) y firmado con la clave de depuración del
      # ejecutor; el debug, por si R8 rompe algo de jaudiotagger.
      - name: Build APKs
        working-directory: surco
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          set -e
          cp surco/app/build/outputs/apk/release/app-release.apk Surco.apk
          cp surco/app/build/outputs/apk/debug/app-debug.apk Surco-debug.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging Surco.apk | head -3
          ls -l Surco.apk Surco-debug.apk
          sha256sum Surco.apk Surco-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: surco-apk
          path: |
            Surco.apk
            Surco-debug.apk
          if-no-files-found: error

      # Rama `apk-surco` de un solo commit, para recoger el APK con git desde
      # donde el almacén de artifacts no llega. Se reescribe en cada compilación.
      - name: Publish APK to the `apk-surco` branch
        run: |
          set -e
          work=$(mktemp -d)
          cp Surco.apk Surco-debug.apk "$work/"
          cd "$work"
          sha256sum Surco.apk Surco-debug.apk > SHA256SUMS
          git init -q -b apk-surco
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Surco.apk Surco-debug.apk SHA256SUMS
          git commit -q -m "APK de Surco de ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-surco
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: surco-apk }

      # Dos canciones con etiquetas que MediaStore no lee: un MP3 (ID3v2.4) y
      # un FLAC (Vorbis). Valores en ASCII: `adb shell input text` no escribe tildes.
      - name: Make test music
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir musica
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=20" -c:a libmp3lame -b:a 192k \
            -id3v2_version 4 -metadata title="Prueba Uno" -metadata artist="Banda Surco" \
            -metadata album="Disco de Prueba" -metadata genre="Rock" -metadata date=2019 \
            -metadata TBPM=128 -metadata TMOO=zorzal musica/uno.mp3
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=330:duration=20" -c:a flac \
            -metadata TITLE="Prueba Dos" -metadata ARTIST="Otra Banda" -metadata ALBUM="Disco de Prueba" \
            -metadata GENRE="Jazz" -metadata DATE=1987 -metadata BPM=95 -metadata LABEL=sellonorte \
            musica/dos.flac
          # Caso reservado: 96 kHz, 24 bits, un canal.
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=550:duration=20:sample_rate=96000" -ac 1 -c:a flac -sample_fmt s32 \
            -bits_per_raw_sample 24 -metadata TITLE="Prueba Tres" -metadata ARTIST="Tercera Banda" -metadata MOOD=tres96 \
            musica/tres.flac
          ls -l musica

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/smoke-surco.sh Surco.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-surco
          path: |
            *.png
            ui.xml
            logcat.txt
            crash.txt
