name: Build APK

on:
  workflow_dispatch:
    inputs:
      apk_branch:
        description: >-
          Qué hacer con la rama `apk`. `publicar` deja ahí el APK además de
          como artifact, para recogerlo con git desde donde el almacén de
          artifacts no es accesible. `borrar` la elimina y no compila nada:
          esos 6 MB de binario no deben quedarse en el repositorio más de lo
          necesario, que es justo lo que `.gitignore` evita en el resto del
          proyecto.
        type: choice
        options: [ 'no', 'publicar', 'borrar' ]
        default: 'no'
  push:
    paths:
      - 'android/**'
      # Cualquier módulo del cliente: el APK empaqueta el bundle, que los
      # contiene todos. Vigilar solo dos de ellos --- como hacía antes --- deja
      # de disparar la compilación cuando cambia el detector o el cerebro.
      - 'argos/api/static/**'
      - 'scripts/bundle.py'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  # Limpieza a demanda. Va en este mismo workflow y no aparte porque es el
  # reverso exacto del paso que publica: quien crea la rama tiene que poder
  # deshacerla, o se queda para siempre.
  cleanup:
    if: inputs.apk_branch == 'borrar'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the `apk` branch
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/apk" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/apk"
            echo "rama apk borrada"
          else
            echo "la rama apk no existe; nada que borrar"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Borrar no compila: sería gastar cinco minutos de runner en un APK que
    # nadie ha pedido.
    if: inputs.apk_branch != 'borrar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages: ''` no es cosmético: por defecto esta acción ejecuta
      # `sdkmanager tools`, y `tools` es un paquete retirado del repositorio de
      # Google. El resultado es `Failed to find package 'tools'` y el job muere
      # en el segundo 20, antes de tocar una sola línea de ARGOS. Lo que hace
      # falta --- la platform 34 y las build-tools --- lo descarga solo el
      # plugin de Android durante `assembleDebug`, con las licencias ya
      # aceptadas por esta misma acción.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El APK empaqueta el MISMO fichero que se entrega para escritorio. Se
      # genera aquí en lugar de versionarlo: un artefacto de compilación
      # guardado junto al código se desincroniza, y ya ocurrió una vez en este
      # repositorio.
      - name: Build single-file bundle
        run: |
          python3 scripts/bundle.py --out argos.html
          ls -l argos.html

      # El modelo viaja dentro del APK. Sin él hay que ir a buscarlo a una
      # release de GitHub desde el móvil, que es donde peor se hace.
      - name: Fetch detector weights
        run: |
          curl -sSL -o yolox_nano.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
          test "$(stat -c%s yolox_nano.onnx)" -gt 3000000

      # ONNX Runtime Web viaja DENTRO del APK.
      #
      # Hasta ahora se traía de un CDN en tiempo de ejecución. El modelo iba
      # dentro y el motor que lo ejecuta, fuera: sin red --- o con el CDN
      # bloqueado, o con datos móviles malos --- el detector nunca cargaba y la
      # aplicación se quedaba en sustracción de fondo, etiquetando manchas por
      # su proporción. Desde fuera parece que funciona y se inventa las clases.
      #
      # Además, un recurso externo es incompatible con el aislamiento entre
      # orígenes que hace falta para los hilos de WASM.
      - name: Vendor ONNX Runtime Web
        run: |
          set -eu
          npm pack onnxruntime-web@1.22.0 >/dev/null
          tar xf onnxruntime-web-1.22.0.tgz
          echo "--- dist/ tal cual lo publica el paquete ---"
          ls -la package/dist/
          mkdir -p ort
          cp package/dist/ort.min.js ort/
          # Todo lo de WASM menos los artefactos de entrenamiento, que no se
          # usan aquí y pesan tanto como el resto junto.
          find package/dist -maxdepth 1 \( -name 'ort-wasm*.wasm' -o -name 'ort-wasm*.mjs' \) \
            ! -name '*training*' -exec cp {} ort/ \;
          echo "--- lo que entra en el APK ---"
          ls -la ort/
          du -sh ort/
          test -f ort/ort.min.js
          ls ort/*.wasm >/dev/null

      # El wrapper incluye un .jar binario que no siempre conviene versionar.
      # Si falta, se genera aquí con el Gradle del runner: así el repositorio
      # queda solo con texto y la compilación sigue siendo reproducible.
      - name: Ensure Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Comprobación barata que atrapa el fallo más caro: un APK que arranca,
      # enseña la cámara y no detecta nada porque el motor no se copió.
      - name: Verify web assets were bundled
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/index.html' || { echo "falta index.html"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/yolox_nano.onnx' || { echo "falta el modelo"; exit 1; }
          # El runtime pesa y es la pieza que faltaba: sin él el APK arranca,
          # enseña la cámara y no clasifica nada.
          unzip -l "$APK" | grep -q 'assets/ort.min.js' || { echo "falta ONNX Runtime"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/ort-wasm.*\.wasm' || { echo "faltan los .wasm"; exit 1; }

          # Que el fichero esté no basta: tiene que llevar los módulos dentro.
          # Comprobar solo el nombre dejaba pasar un bundle recortado, que
          # arranca, enseña la cámara y no detecta nada --- el fallo más caro
          # porque parece que funciona.
          mkdir -p /tmp/apk && unzip -o -q "$APK" assets/index.html -d /tmp/apk
          for m in "class Engine" "class YoloxDetector" "class Brain" \
                   "class Archive" "class BehaviourModel" "class DetectorWorker" \
                   "class GroundPlane" "class CameraRegistry" "function planSynopsis"; do
            grep -q "$m" /tmp/apk/assets/index.html || { echo "falta: $m"; exit 1; }
          done
          echo "APK completo: $(stat -c%s /tmp/apk/assets/index.html) bytes de app + modelo"

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ARGOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ARGOS.apk
          if-no-files-found: error

      # Salida alternativa, apagada por defecto. El artifact se sirve desde un
      # almacén que no es alcanzable desde todas las redes, y llega como .zip;
      # una rama se recoge con `git fetch` desde cualquier sitio que llegue a
      # github.com. La rama es huérfana y contiene solo el APK: no arrastra
      # historia, y al no tocar ninguna de las rutas vigiladas arriba tampoco
      # vuelve a disparar este workflow.
      - name: Publish APK to the `apk` branch
        if: inputs.apk_branch == 'publicar'
        run: |
          set -e
          work=$(mktemp -d)
          cp ARGOS.apk "$work/"
          cd "$work"
          git init -q -b apk
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ARGOS.apk
          git commit -q -m "APK de ${GITHUB_SHA:0:8}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" apk
          echo "APK en la rama apk ($(stat -c%s ARGOS.apk) bytes)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 y no 30.
          #
          # La imagen de API 30 trae un WebView de 2020, anterior a Chrome 91,
          # y por tanto **sin WebAssembly SIMD**. ONNX Runtime 1.22 ya no
          # publica ningún artefacto sin SIMD, así que ahí no hay backend
          # posible: el detector no arranca y el fallo no tiene nada que ver
          # con el APK. Ningún teléfono real está en ese estado --- el WebView
          # se actualiza por Play Store --- así que comprobar contra API 30
          # era comprobar contra un dispositivo que no existe.
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          # Una sola línea a propósito: esta acción ejecuta el bloque
          # `script:` línea a línea con `sh -c`, así que cualquier construcción
          # de varias líneas (un `if`, un `for`) le llega partida al shell y
          # revienta con un error de sintaxis --- con el APK ya instalado y
          # funcionando. Toda la lógica vive en el script.
          script: bash .github/scripts/smoke.sh ARGOS.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            screenshot.png
            logcat.txt
